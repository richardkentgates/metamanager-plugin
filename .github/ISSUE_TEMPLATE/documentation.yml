name: Documentation Issue
description: Report a problem with docs, help tabs, or inline comments
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what's wrong or missing in the documentation.

  - type: textarea
    id: location
    attributes:
      label: Where is the issue?
      description: "File name, page URL, help tab, or admin screen."
      placeholder: "e.g. ARCHITECTURE.md REST API table, or MM Settings → Compression tab"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong or missing
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
