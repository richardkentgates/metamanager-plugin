name: Auto Bump Version

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump patch version on dev push
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"

      - name: Validate compatibility map
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          if ! grep -q "\"${NEXT}\"" daemon-compatibility.json; then
            DAEMON_VER=$(head -1 daemon-compatibility.json | grep -oP '"2\.\d+\.\d+"' | head -1 | tr -d '"')
            if [ -z "$DAEMON_VER" ]; then
              DAEMON_VER="2.4.8"
            fi

            echo "Auto-adding daemon-compatibility.json entry: ${NEXT} -> ${DAEMON_VER}"

            python3 -c "
          import json
          with open('daemon-compatibility.json', 'r') as f:
              data = json.load(f)
          data = {'${NEXT}': '${DAEMON_VER}', **data}
          with open('daemon-compatibility.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          fi
          echo "daemon-compatibility.json has entry for ${NEXT}"

      - name: Bump patch version
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date +%Y-%m-%d)

          sed -i "s/^\( \* Version:\s*\)[0-9]\+\.[0-9]\+\.[0-9]\+/\1${NEW_VERSION}/" metamanager.php
          sed -i "s/define( 'MM_VERSION',     '[^']*'/define( 'MM_VERSION',     '${NEW_VERSION}'/" metamanager.php
          sed -i "s/^Stable tag: [0-9]\+\.[0-9]\+\.[0-9]\+/Stable tag: ${NEW_VERSION}/" readme.txt

          export CURRENT NEW_VERSION DATE
          python3 << 'PYEOF'
          import os
          current = os.environ["CURRENT"]
          new_version = os.environ["NEW_VERSION"]
          date = os.environ["DATE"]
          entry = f"\n## [{new_version}] - {date}\n\n### Changed\n- Auto-incremented version from {current} to {new_version}\n"
          with open("CHANGELOG.md", "r") as f:
              lines = f.readlines()
          idx = next((i for i, l in enumerate(lines) if l.startswith("## ")), len(lines))
          lines.insert(idx, entry)
          with open("CHANGELOG.md", "w") as f:
              f.writelines(lines)
          PYEOF

          git add metamanager.php readme.txt CHANGELOG.md daemon-compatibility.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push origin dev
