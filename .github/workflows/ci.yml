name: Quality and Security Checks

on:
  push:
    branches: [dev]

permissions: {}

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' ! -path './vendor/*' ! -path './tests/*' ! -path './stubs/*' -exec php -l {} \; | tee /tmp/php-lint.log
          if grep -q "Errors parsing" /tmp/php-lint.log; then
            exit 1
          fi

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon --no-progress

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint bash files
        run: |
          find . -name "*.sh" -not -path "./vendor/*" -not -path "./tests/*" | while read f; do
            shellcheck -S error "$f"
          done

  integration:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            wp: "6.4"
          - php: "8.2"
            wp: "6.5"
          - php: "8.3"
            wp: "latest"
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Download PHPUnit
        run: |
          curl -L https://phar.phpunit.de/phpunit-9.6.0.phar -o /usr/local/bin/phpunit
          chmod +x /usr/local/bin/phpunit

      - name: Setup WP test environment
        run: bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true
        env:
          WP_TESTS_TAG: ${{ matrix.wp }}

      - name: Run PHPUnit
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            phpunit --configuration phpunit.xml --testsuite Integration --coverage-clover=coverage.xml
          else
            phpunit --configuration phpunit.xml --testsuite Integration
          fi

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  daemon-compat:
    name: Daemon Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate daemon-compatibility.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. JSON syntax
          python3 -c "import json; json.load(open('daemon-compatibility.json'))"
          echo "JSON syntax OK"

          # 2. Current plugin version has an entry
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "Plugin version: $CURRENT"
          if ! grep -q "\"${CURRENT}\"" daemon-compatibility.json; then
            echo "::error::daemon-compatibility.json has no entry for current version ${CURRENT}"
            exit 1
          fi
          DAEMON_VER=$(python3 -c "import json; print(json.load(open('daemon-compatibility.json'))['${CURRENT}'])")
          echo "Required daemon version: $DAEMON_VER"

          # 3. Verify the daemon version exists as a tag in the daemon repo
          if ! gh api repos/richardkentgates/metamanager/tags --paginate -q '.[].name' | grep -q "^v${DAEMON_VER}$"; then
            echo "::error::Daemon tag v${DAEMON_VER} not found in richardkentgates/metamanager"
            echo "Available tags:"
            gh api repos/richardkentgates/metamanager/tags --paginate -q '.[].name' | grep "^v2\.4\." | sort -V | tail -10
            exit 1
          fi
          echo "Daemon tag v${DAEMON_VER} verified"

          # 4. Verify all unique daemon versions referenced in the map exist
          UNIQUE_DAEMONS=$(python3 -c "import json; print('\n'.join(sorted(set(json.load(open('daemon-compatibility.json')).values()))))")
          echo "All unique daemon versions in map:"
          echo "$UNIQUE_DAEMONS"
          MISSING=0
          while IFS= read -r ver; do
            [ -z "$ver" ] && continue
            if ! gh api repos/richardkentgates/metamanager/tags --paginate -q '.[].name' | grep -q "^v${ver}$"; then
              echo "::warning::Daemon tag v${ver} not found in richardkentgates/metamanager (referenced in map)"
              MISSING=1
            fi
          done <<< "$UNIQUE_DAEMONS"
          if [ "$MISSING" -eq 1 ]; then
            echo "::warning::Some daemon versions in the compatibility map have no matching tag"
          else
            echo "All daemon versions verified"
          fi

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [php-lint, phpstan, shellcheck, integration, daemon-compat]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p build/metamanager
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' \
            --exclude='tests' --exclude='stubs' --exclude='mm-*.zip' \
            --exclude='.editorconfig' --exclude='phpunit.xml.dist' \
            ./ build/metamanager/
          cd build && zip -r ../metamanager-latest.zip metamanager

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metamanager-dev-${{ github.run_id }}
          path: metamanager-latest.zip
          retention-days: 30

  version-bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    needs: [php-lint, phpstan, shellcheck, integration, build, daemon-compat]
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"

      - name: Validate compatibility map
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          if ! grep -q "\"${NEXT}\"" daemon-compatibility.json; then
            DAEMON_VER=$(gh api repos/richardkentgates/metamanager/contents/VERSION -q '.content' | base64 -d | tr -d '[:space:]' || true)
            if [ -z "$DAEMON_VER" ]; then
              DAEMON_VER="2.4.32"
            fi

            echo "Auto-adding daemon-compatibility.json entry: ${NEXT} -> ${DAEMON_VER}"

            python3 -c "
          import json
          with open('daemon-compatibility.json', 'r') as f:
              data = json.load(f)
          data = {'${NEXT}': '${DAEMON_VER}', **data}
          with open('daemon-compatibility.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          fi
          echo "daemon-compatibility.json has entry for ${NEXT}"

      - name: Bump patch version
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date +%Y-%m-%d)

          sed -i "s/^\( \* Version:\s*\)[0-9]\+\.[0-9]\+\.[0-9]\+/\1${NEW_VERSION}/" metamanager.php
          sed -i "s/define( 'MM_VERSION',     '[^']*'/define( 'MM_VERSION',     '${NEW_VERSION}'/" metamanager.php
          sed -i "s/^Stable tag: [0-9]\+\.[0-9]\+\.[0-9]\+/Stable tag: ${NEW_VERSION}/" readme.txt

          export CURRENT NEW_VERSION DATE
          python3 << 'PYEOF'
          import os
          current = os.environ["CURRENT"]
          new_version = os.environ["NEW_VERSION"]
          date = os.environ["DATE"]
          entry = f"\n## [{new_version}] - {date}\n\n### Changed\n- Auto-incremented version from {current} to {new_version}\n"
          with open("CHANGELOG.md", "r") as f:
              lines = f.readlines()
          idx = next((i for i, l in enumerate(lines) if l.startswith("## ")), len(lines))
          lines.insert(idx, entry)
          with open("CHANGELOG.md", "w") as f:
              f.writelines(lines)
          PYEOF

          git add metamanager.php readme.txt CHANGELOG.md daemon-compatibility.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin dev
