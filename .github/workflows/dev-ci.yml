name: Dev CI

on:
  push:
    branches: ["dev"]

permissions:
  contents: write

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.0", "8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -not -path "./stubs/*" | while read f; do
            php -l "$f" 2>&1
          done | grep -v "No syntax errors" || true

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon --no-progress

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint bash files
        run: |
          find . -name "*.sh" -not -path "./vendor/*" -not -path "./tests/*" | while read f; do
            shellcheck -S error "$f"
          done

  version-bump:
    name: Auto-increment Version
    needs: [lint, static-analysis, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        run: |
          # Read current version from MM_VERSION constant
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "Current version: $CURRENT"

          # Bump patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "New version: $NEW_VERSION"

          # Update metamanager.php header
          sed -i "s/Version:      ${CURRENT}/Version:      ${NEW_VERSION}/" metamanager.php

          # Update MM_VERSION constant
          sed -i "s/define( 'MM_VERSION',     '${CURRENT}' )/define( 'MM_VERSION',     '${NEW_VERSION}' )/" metamanager.php

          # Update readme.txt stable tag
          sed -i "s/Stable tag: ${CURRENT}/Stable tag: ${NEW_VERSION}/" readme.txt

          # Update CHANGELOG.md — add new entry
          DATE=$(date +%Y-%m-%d)
          sed -i "/^## /a\\
\\
## [${NEW_VERSION}] - ${DATE}\\
\\
### Changed\\
- Auto-incremented version from ${CURRENT} to ${NEW_VERSION}" CHANGELOG.md

          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metamanager.php readme.txt CHANGELOG.md
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push
