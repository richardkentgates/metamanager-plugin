name: Dev CI — Lint & Version Bump

on:
  push:
    branches: ["dev"]

permissions:
  contents: write

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.0", "8.2", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" -not -path "./stubs/*" | while read f; do
            php -l "$f" 2>&1
          done | grep -v "No syntax errors" || true

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration phpstan.neon --no-progress

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint bash files
        run: |
          find . -name "*.sh" -not -path "./vendor/*" -not -path "./tests/*" | while read f; do
            shellcheck -S error "$f"
          done

  version-bump:
    name: Auto-increment Version
    needs: [lint, static-analysis, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate compatibility map
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"

          if ! grep -q "\"${NEXT}\"" daemon-compatibility.json; then
            # Find the daemon version from the most recent entry.
            DAEMON_VER=$(head -1 daemon-compatibility.json | grep -oP '"2\.\d+\.\d+"' | head -1 | tr -d '"')
            if [ -z "$DAEMON_VER" ]; then
              DAEMON_VER="2.4.8"
            fi

            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  FAIL: daemon-compatibility.json missing entry for ${NEXT}"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "  Add this line to the TOP of daemon-compatibility.json:"
            echo ""
            echo "    \"${NEXT}\": \"${DAEMON_VER}\","
            echo ""
            echo "  If daemon code changed, use the NEW daemon version instead."
            echo "  See AGENTS.md → Release Checklist for details."
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "✓ daemon-compatibility.json has entry for ${NEXT}"

      - name: Bump patch version
        run: |
          CURRENT=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date +%Y-%m-%d)

          sed -i "s/^\( \* Version:\s*\)[0-9]\+\.[0-9]\+\.[0-9]\+/\1${NEW_VERSION}/" metamanager.php
          sed -i "s/define( 'MM_VERSION',     '[^']*'/define( 'MM_VERSION',     '${NEW_VERSION}'/" metamanager.php
          sed -i "s/^Stable tag: [0-9]\+\.[0-9]\+\.[0-9]\+/Stable tag: ${NEW_VERSION}/" readme.txt

          export CURRENT NEW_VERSION DATE
          python3 << 'PYEOF'
          import os
          current = os.environ["CURRENT"]
          new_version = os.environ["NEW_VERSION"]
          date = os.environ["DATE"]
          entry = f"\n## [{new_version}] - {date}\n\n### Changed\n- Auto-incremented version from {current} to {new_version}\n"
          with open("CHANGELOG.md", "r") as f:
              lines = f.readlines()
          idx = next((i for i, l in enumerate(lines) if l.startswith("## ")), len(lines))
          lines.insert(idx, entry)
          with open("CHANGELOG.md", "w") as f:
              f.writelines(lines)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metamanager.php readme.txt CHANGELOG.md
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push
