name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Sync daemon-compatibility.json to daemon main branch version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAEMON_VER=$(gh api repos/richardkentgates/metamanager/contents/VERSION?ref=main -q '.content' | base64 -d | tr -d '[:space:]' 2>/dev/null || true)
          if [ -z "$DAEMON_VER" ]; then
            echo "::error::Could not read VERSION from daemon repo main branch"
            exit 1
          fi
          echo "Daemon main branch version: $DAEMON_VER"

          PLUGIN_VER=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "Plugin version: $PLUGIN_VER"

          python3 -c "
        import json
        with open('daemon-compatibility.json', 'r') as f:
            data = json.load(f)
        data['${PLUGIN_VER}'] = '${DAEMON_VER}'
        with open('daemon-compatibility.json', 'w') as f:
            json.dump(data, f, indent=2)
            f.write('\n')
        "
          echo "Updated daemon-compatibility.json: ${PLUGIN_VER} -> ${DAEMON_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daemon-compatibility.json
          git diff --cached --quiet || git commit -m "chore: sync daemon-compat to main branch daemon v${DAEMON_VER}"
          git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build plugin zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p build/metamanager
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' \
            --exclude='tests' --exclude='stubs' --exclude='mm-*.zip' \
            --exclude='.editorconfig' --exclude='phpunit.xml.dist' \
            --exclude='AGENTS.md' --exclude='AUDIT-TRACKING.md' \
            --exclude='CONTRIBUTING.md' --exclude='ROADMAP.md' \
            --exclude='phpunit.xml' \
            ./ build/metamanager/
          cd build && zip -r ../metamanager-${{ steps.version.outputs.version }}.zip metamanager
          echo "Built zip: $(ls -lh ../metamanager-${{ steps.version.outputs.version }}.zip)"

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: metamanager-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Deploy to apt server
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/metamanager"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            metamanager-${{ steps.version.outputs.version }}.zip \
            "${APT_USER}@${APT_HOST}:/var/www/html/metamanager/metamanager-latest.zip"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "printf '%s\n' '{\"version\":\"${{ steps.version.outputs.version }}\",\"requires\":{\"php\":\"8.0\",\"wordpress\":\"6.2\"},\"download_url\":\"https://apt.richardkentgates.com/metamanager/metamanager-latest.zip\"}' > /var/www/html/metamanager/metadata.json"

          echo "Deployed plugin v${{ steps.version.outputs.version }} to apt server"

      - name: Validate deployed metadata
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Waiting for metadata to propagate..."
          sleep 5

          METADATA_URL="https://apt.richardkentgates.com/metamanager/metadata.json"
          METADATA=$(curl -sf "$METADATA_URL" 2>/dev/null)

          if [ -z "$METADATA" ]; then
            echo "ERROR: Could not fetch metadata.json from $METADATA_URL"
            exit 1
          fi

          ERRORS=""
          VERSION=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null)
          DOWNLOAD=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('download_url',''))" 2>/dev/null)
          PHP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('php',''))" 2>/dev/null)
          WP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('wordpress',''))" 2>/dev/null)

          [ -z "$VERSION" ] && ERRORS="${ERRORS}  - missing 'version'\n"
          [ -z "$DOWNLOAD" ] && ERRORS="${ERRORS}  - missing 'download_url'\n"
          [ -z "$PHP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.php'\n"
          [ -z "$WP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.wordpress'\n"

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  FAIL: metadata.json is missing required fields"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            printf "$ERRORS"
            echo ""
            echo "  Current metadata:"
            echo "$METADATA" | python3 -m json.tool 2>/dev/null || echo "$METADATA"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "metadata.json is valid: version=${VERSION}, requires.php=${PHP_REQ}, requires.wordpress=${WP_REQ}"

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created"
          echo "  ✓ Plugin zip deployed to apt server"
          echo "  ✓ metadata.json validated"
          echo ""
          echo "  WordPress will detect the update via MM_Updater"
          echo "  Daemon update triggers automatically on plugin update"
          echo ""
