name: Promote to Main

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "test" ]]; then
            echo "::error::This workflow can only be run from the test branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: test -> main"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CI status for the dev tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin dev test
          DEV_SHA=$(git rev-parse origin/dev)
          echo "dev HEAD: $DEV_SHA"

          LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
          echo "latest dev CI: status=${STATUS} conclusion=${CONCLUSION} head=${HEAD_SHA}"

          # Push events have wedged in GitHub's queue before; if the tree
          # lacks a green pinned run, CAUSE one and wait. Tests are never
          # skipped — they are created on demand.
          PARENT_SHA=$(git rev-parse "$DEV_SHA^1" 2>/dev/null || echo none)
          needs_ci=false
          [[ "$STATUS" != "completed" || "$STATUS" == "null" || -z "$STATUS" ]] && needs_ci=true
          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            needs_ci=true
          fi
          if [[ "$needs_ci" == "true" ]]; then
            echo "No green CI run for the dev tree ($DEV_SHA) — dispatching CI and waiting..."
            gh workflow run "Quality and Security Checks" --ref dev
            for i in $(seq 1 40); do
              sleep 15
              LATEST_RUN=$(gh run list --repo ${{ github.repository }} \
                --workflow "ci.yml" \
                --branch "dev" \
                --limit 1 \
                --json status,conclusion,headSha \
                --jq '.[0]')
              STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
              CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
              HEAD_SHA=$(echo "$LATEST_RUN" | jq -r '.headSha')
              echo "  wait $i: status=${STATUS} head=${HEAD_SHA}"
              if [[ "$STATUS" == "completed" ]] \
                 && { [[ "$HEAD_SHA" == "$DEV_SHA" ]] || [[ "$HEAD_SHA" == "$PARENT_SHA" ]]; }; then
                break
              fi
            done
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on dev before promoting."
            exit 1
          fi

          if [[ "$HEAD_SHA" != "$DEV_SHA" && "$HEAD_SHA" != "$PARENT_SHA" ]]; then
            echo "::error::Latest CI ran on ${HEAD_SHA} but dev is at ${DEV_SHA} — untested commits on dev."
            exit 1
          fi

          # test must contain dev's tree — never ship a stale test branch.
          if ! git diff --quiet origin/test origin/dev; then
            echo "::error::test tree differs from dev. Run 'Promote to Test' first."
            git diff --stat origin/test origin/dev | head -20
            exit 1
          fi

          echo "CI green for the dev tree (${HEAD_SHA}). Proceeding with promotion."

  promote:
    name: Merge, Tag, Release & Deploy
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge test into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/test --no-edit -X theirs

      - name: Push main
        run: git push origin main

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build plugin zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p build/metamanager
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' \
            --exclude='tests' --exclude='stubs' --exclude='mm-*.zip' \
            --exclude='.editorconfig' --exclude='phpunit.xml.dist' \
            --exclude='AGENTS.md' --exclude='AUDIT-TRACKING.md' \
            --exclude='CONTRIBUTING.md' --exclude='ROADMAP.md' \
            --exclude='phpunit.xml' \
            ./ build/metamanager/
          cd build && zip -r ../metamanager-${{ steps.version.outputs.version }}.zip metamanager
          echo "Built zip: $(ls -lh ../metamanager-${{ steps.version.outputs.version }}.zip)"

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: metamanager-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      - name: Deploy to apt server
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/metamanager && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/metamanager"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            metamanager-${{ steps.version.outputs.version }}.zip \
            "${APT_USER}@${APT_HOST}:/var/www/html/metamanager/metamanager-latest.zip"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "printf '%s\n' '{\"version\":\"${{ steps.version.outputs.version }}\",\"requires\":{\"php\":\"8.0\",\"wordpress\":\"6.2\"},\"download_url\":\"https://apt.richardkentgates.com/metamanager/metamanager-latest.zip\"}' > /var/www/html/metamanager/metadata.json"

          echo "Deployed plugin v${{ steps.version.outputs.version }} to apt server"

      - name: Validate deployed metadata
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Waiting for metadata to propagate..."
          sleep 5

          METADATA_URL="https://apt.richardkentgates.com/metamanager/metadata.json"
          METADATA=$(curl -sf "$METADATA_URL" 2>/dev/null)

          if [ -z "$METADATA" ]; then
            echo "ERROR: Could not fetch metadata.json from $METADATA_URL"
            exit 1
          fi

          ERRORS=""
          VERSION=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('version',''))" 2>/dev/null)
          DOWNLOAD=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('download_url',''))" 2>/dev/null)
          PHP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('php',''))" 2>/dev/null)
          WP_REQ=$(echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('requires',{}).get('wordpress',''))" 2>/dev/null)

          [ -z "$VERSION" ] && ERRORS="${ERRORS}  - missing 'version'\n"
          [ -z "$DOWNLOAD" ] && ERRORS="${ERRORS}  - missing 'download_url'\n"
          [ -z "$PHP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.php'\n"
          [ -z "$WP_REQ" ] && ERRORS="${ERRORS}  - missing 'requires.wordpress'\n"

          if [ -n "$ERRORS" ]; then
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  FAIL: metadata.json is missing required fields"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            printf "$ERRORS"
            echo ""
            echo "  Current metadata:"
            echo "$METADATA" | python3 -m json.tool 2>/dev/null || echo "$METADATA"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "metadata.json is valid: version=${VERSION}, requires.php=${PHP_REQ}, requires.wordpress=${WP_REQ}"

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Release v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged test → main"
          echo "  ✓ Tagged v${{ steps.version.outputs.version }}"
          echo "  ✓ GitHub release created"
          echo "  ✓ Plugin zip deployed to apt server"
          echo "  ✓ metadata.json validated"
          echo ""
          echo "  WordPress will detect the update via MM_Updater"
          echo "  Daemon update triggers automatically on plugin update"
          echo ""
