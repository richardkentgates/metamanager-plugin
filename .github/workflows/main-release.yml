name: Promote to Release — Tag & GitHub Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p build/metamanager
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' \
            --exclude='tests' --exclude='stubs' --exclude='mm-*.zip' \
            --exclude='.editorconfig' --exclude='phpunit.xml.dist' \
            ./ build/metamanager/
          cd build && zip -r ../metamanager-${{ steps.version.outputs.version }}.zip metamanager

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: metamanager-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
