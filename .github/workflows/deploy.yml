name: Deploy Plugin to Server

on:
  push:
    branches: [ "test", "main" ]
    paths:
      - 'includes/**'
      - 'templates/**'
      - 'assets/**'
      - 'languages/**'
      - 'metamanager.php'
      - 'uninstall.php'
      - 'index.php'
      - '.github/workflows/deploy.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "deploy_path=/var/www/html/metamanager/" >> $GITHUB_OUTPUT
          else
            echo "branch=test" >> $GITHUB_OUTPUT
            echo "deploy_path=/var/www/html/metamanager-test/" >> $GITHUB_OUTPUT
          fi

      - name: Build plugin zip
        run: |
          PLUGIN_VERSION=$(grep -oP 'Version:\s+\K[^\s]+' metamanager.php)
          ZIP_NAME="metamanager-${PLUGIN_VERSION}.zip"

          # Create clean build excluding dev files
          mkdir -p build
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'tests' \
            ! -name 'build' \
            ! -name 'composer.json' \
            ! -name 'phpstan.neon' \
            ! -name 'phpunit.xml.dist' \
            ! -name 'phpunit.xml' \
            ! -name '.distignore' \
            ! -name 'JOB_QUEUE_SPEC.md' \
            ! -name '*.md' \
            -exec cp -r {} build/ \;

          cd build
          zip -r "../${ZIP_NAME}" .
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy files to server
        run: |
          DEPLOY_PATH="${{ steps.env.outputs.deploy_path }}"

          # Create target directory
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo mkdir -p ${DEPLOY_PATH} && sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} ${DEPLOY_PATH}"

          # Upload all files via scp
          cd build
          find . -type f | while read -r file; do
            remote_path="${DEPLOY_PATH}$(echo "${file}" | sed 's|^\./||')"
            remote_dir=$(dirname "${remote_path}")
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "sudo mkdir -p ${remote_dir}"
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${file}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/$(basename "${file}")"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "sudo mv /tmp/$(basename "${file}") ${remote_path}"
          done
          cd ..

          # Upload zip
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ env.ZIP_NAME }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/${{ env.ZIP_NAME }}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo mv /tmp/${{ env.ZIP_NAME }} ${DEPLOY_PATH}metamanager-latest.zip"

          # Create and upload metadata.json
          cat > /tmp/metadata.json << EOF
          {
            "version": "${{ env.PLUGIN_VERSION }}",
            "requires": {
              "php": "8.0",
              "wordpress": "6.2"
            },
            "download_url": "https://${{ secrets.DEPLOY_HOST }}/metamanager/metamanager-latest.zip"
          }
          EOF

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/metadata.json \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/metadata.json"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo mv /tmp/metadata.json ${DEPLOY_PATH}metadata.json && sudo chown -R www-data:www-data ${DEPLOY_PATH}"

      - name: Verify deployment
        run: |
          echo "Deployed to ${{ steps.env.outputs.deploy_path }}"
          echo "Plugin version: ${{ env.PLUGIN_VERSION }}"
          echo "Zip: ${{ env.ZIP_NAME }}"
