name: Promote to Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD: ${{ github.ref_name }}
        run: |
          if [[ "$HEAD" != "dev" ]]; then
            echo "::error::This workflow can only be run from the dev branch. Current branch: $HEAD"
            exit 1
          fi
          echo "Promotion path valid: dev -> test"

  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status on dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking CI status for workflow 'ci.yml' on branch 'dev'..."

          LATEST_RUN=$(gh run list \
            --workflow "ci.yml" \
            --branch "dev" \
            --limit 1 \
            --json status,conclusion,name \
            --jq '.[0]')

          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')
          NAME=$(echo "$LATEST_RUN" | jq -r '.name')

          echo "Latest run: name=${NAME}, status=${STATUS}, conclusion=${CONCLUSION}"

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI is still running (status=${STATUS}). Wait for it to complete before promoting."
            exit 1
          fi

          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI failed (conclusion=${CONCLUSION}). Fix the issues on dev before promoting."
            exit 1
          fi

          echo "CI passed. Proceeding with promotion."

  promote:
    name: Merge, Build & Deploy to Apt
    runs-on: ubuntu-latest
    needs: [validate, check-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: test
          fetch-depth: 0

      - name: Merge dev into test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge origin/dev --no-edit -X theirs

      - name: Push test
        run: git push origin test

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "define\(\s*'MM_VERSION'\s*,\s*'\\K[^']*" metamanager.php)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        run: |
          mkdir -p build/metamanager
          rsync -a --exclude='.git' --exclude='docs' --exclude='.github' \
            --exclude='tests' --exclude='stubs' --exclude='mm-*.zip' \
            --exclude='.editorconfig' --exclude='phpunit.xml.dist' \
            --exclude='AGENTS.md' --exclude='AUDIT-TRACKING.md' \
            --exclude='CONTRIBUTING.md' --exclude='ROADMAP.md' \
            --exclude='phpunit.xml' \
            ./ build/metamanager/
          cd build && zip -r ../metamanager-${{ steps.version.outputs.version }}.zip metamanager
          echo "Built zip: $(ls -lh ../metamanager-${{ steps.version.outputs.version }}.zip)"

      - name: Deploy to apt server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APT_HOST: ${{ secrets.DEPLOY_HOST }}
          APT_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${APT_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "sudo mkdir -p /var/www/html/metamanager-test && sudo chown -R ${APT_USER}:${APT_USER} /var/www/html/metamanager-test"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            metamanager-${{ steps.version.outputs.version }}.zip \
            "${APT_USER}@${APT_HOST}:/var/www/html/metamanager-test/metamanager-latest.zip"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${APT_USER}@${APT_HOST}" \
            "printf '%s\n' '{\"version\":\"${{ steps.version.outputs.version }}\",\"requires\":{\"php\":\"8.0\",\"wordpress\":\"6.2\"},\"download_url\":\"https://apt.richardkentgates.com/metamanager-test/metamanager-latest.zip\"}' > /var/www/html/metamanager-test/metadata.json"

          echo "Deployed plugin v${{ steps.version.outputs.version }} to apt server (test channel)"

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Test promotion v${{ steps.version.outputs.version }} complete"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  ✓ Merged dev → test"
          echo "  ✓ Plugin zip deployed to apt server (test channel)"
          echo ""
