<section style="padding:1.5rem;background:#f0f8e8;border-radius:8px;">
    <h3>Supported Formats</h3>
    <ul>
        <li><strong>JPEG</strong> — Lossless compression via jpegtran</li>
        <li><strong>PNG</strong> — Lossless compression via optipng</li>
        <li><strong>WebP</strong> — Lossless recompression via cwebp</li>
        <li><strong>AVIF</strong> — Lossless recompression via avifenc</li>
        <li><strong>Video</strong> — Container remux via ffmpeg</li>
    </ul>
</section>
