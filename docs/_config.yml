title: Metamanager Plugin
description: Lossless image compression and metadata embedding for WordPress
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

url: "https://mm-plugin.richardkentgates.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  docs:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"
